<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px;
      margin: 0;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 12px;
      color: #f5c542;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.green { background: #22c55e; }
    .dot.red { background: #ef4444; }
    .label {
      font-size: 13px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin: 12px 0 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 13px;
      border: 1px solid #333;
      border-radius: 4px;
      background: #16213e;
      color: #e0e0e0;
    }
    input:focus {
      outline: none;
      border-color: #f5c542;
    }
    .saved {
      font-size: 11px;
      color: #22c55e;
      margin-top: 6px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .saved.show { opacity: 1; }
    button {
      width: 100%;
      padding: 8px;
      margin-top: 12px;
      font-size: 13px;
      border: 1px solid #333;
      border-radius: 4px;
      background: #16213e;
      color: #e0e0e0;
      cursor: pointer;
    }
    button:hover { background: #1a2a4e; border-color: #f5c542; }
    button:active { background: #0f1a30; }
    button:disabled { opacity: 0.5; cursor: default; }
    .info {
      font-size: 11px;
      color: #888;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <h1>Saint Expeditus Bot</h1>
  <div class="status">
    <div id="bridge-dot" class="dot red"></div>
    <span class="label" id="bridge-label">Bridge: checking...</span>
  </div>

  <label for="targetChat">Target Chat Name</label>
  <input type="text" id="targetChat" placeholder="SAINT EXPEDITUS SUBDIVISION" />

  <label for="botName">Your Facebook Name</label>
  <input type="text" id="botName" placeholder="Clarke Plumo" />

  <div class="saved" id="saved">Settings saved</div>

  <button id="resetBtn">New Conversation</button>
  <div class="saved" id="resetMsg">Conversation reset</div>

  <div class="info">
    Trigger: <code>/expeditus</code> in Messenger group chat
  </div>
  <script src="dist/popup.js" type="module"></script>
</body>
</html>
